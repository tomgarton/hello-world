<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night, log sheet at half height</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
body{margin:0}
a{color:#F3E0B8}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0F1326; color: #F4ECDD; font-family: 'Bricolage Grotesque', system-ui, sans-serif">

<svg aria-hidden="true" width="390" height="400" viewBox="0 0 390 400" style="position: absolute; left: 0; top: 0; opacity: 0.45">
<path d="M324 66a46 46 0 1 0 32 80 38 38 0 0 1-32-80z" fill="#F3E0B8"></path>
<circle cx="236" cy="70" r="2" fill="#F3E0B8"></circle>
<circle cx="196" cy="120" r="1.500" fill="#F3E0B8"></circle>
<circle cx="300" cy="40" r="1.500" fill="#F3E0B8"></circle>
<circle cx="160" cy="200" r="2" fill="#F3E0B8"></circle>
<ellipse cx="300" cy="424" rx="230" ry="110" fill="#1B2550"></ellipse>
<ellipse cx="70" cy="436" rx="220" ry="120" fill="#27336A"></ellipse>
</svg>

<div style="position: absolute; left: 20px; top: 66px; width: 236px; display: flex; flex-direction: column; gap: 8px; opacity: 0.45">
<div style="font-size: 14px; font-weight: 700; letter-spacing: 0.03em">Wednesday, 2:14 am</div>
<div style="font-size: 40px; font-weight: 800; line-height: 1.02; letter-spacing: -0.02em">Just the two of you.</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 548px; box-sizing: border-box; background: #1C2550; border-radius: 34px 34px 0 0; padding: 10px 18px 34px 18px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="width: 40px; height: 5px; border-radius: 3px; background: #5A6498"></div>
<div style="display: flex; align-items: center; justify-content: space-between; align-self: stretch">
<button aria-label="Close" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #2C3670; color: #F4ECDD; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
</button>
<h1 style="margin: 0; font-size: 20px; font-weight: 800">Nappy</h1>
<div style="width: 44px"></div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button aria-pressed="true" style="height: 52px; border: 2.500px solid #8EC0FF; border-radius: 18px; background: #8EC0FF; color: #0F1326; font: inherit; font-size: 17px; font-weight: 800">Milo</button>
<button aria-pressed="false" style="height: 52px; border: 2.500px solid #FFB170; border-radius: 18px; background: transparent; color: #FFB170; font: inherit; font-size: 17px; font-weight: 800">Ollie</button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button style="height: 84px; border: 2.500px solid #F4ECDD; border-radius: 22px; box-shadow: 4px 4px 0 #E6C98F; background: #2C3670; color: #F4ECDD; font: inherit; font-size: 20px; font-weight: 800">Wet</button>
<button style="height: 84px; border: 2.500px solid #F4ECDD; border-radius: 22px; box-shadow: 4px 4px 0 #E6C98F; background: #2C3670; color: #F4ECDD; font: inherit; font-size: 20px; font-weight: 800">Dirty</button>
<button style="height: 84px; border: 2.500px solid #F4ECDD; border-radius: 22px; box-shadow: 4px 4px 0 #E6C98F; background: #2C3670; color: #F4ECDD; font: inherit; font-size: 20px; font-weight: 800">Both</button>
<button style="height: 84px; border: 2.500px solid #F4ECDD; border-radius: 22px; box-shadow: 4px 4px 0 #E6C98F; background: #2C3670; color: #F4ECDD; font: inherit; font-size: 20px; font-weight: 800">Dry</button>
</div>

<div style="font-size: 14px; font-weight: 500; color: #D5CEC0; text-align: center">One tap saves it at 2:14 am. Pull the sheet up to change the time or add a note.</div>

<div style="flex-grow: 1"></div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 48px; border: none; border-radius: 16px; background: #2C3670; color: #F4ECDD; font: inherit; font-size: 15px; font-weight: 700">Now, 2:14 am</button>
<button style="height: 48px; border: none; border-radius: 16px; background: #2C3670; color: #F4ECDD; font: inherit; font-size: 15px; font-weight: 700">Add note</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
