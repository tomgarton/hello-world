name: Puggle
options:
  bundleIdPrefix: app.puggle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here, or choose the team in Xcode after generating.
    DEVELOPMENT_TEAM: ""
targets:
  Puggle:
    type: application
    platform: iOS
    sources:
      - path: Puggle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.puggle.Puggle
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Puggle/Resources/Puggle.entitlements
        INFOPLIST_FILE: Puggle/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
