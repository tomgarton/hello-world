name: Puggle
options:
  bundleIdPrefix: com.tomgarton
  deploymentTarget:
    iOS: "17.0"
    watchOS: "11.0"
  createIntermediateGroups: true
# "Local" is a debug build with iCloud switched off, for a free Apple ID
# (free accounts cannot sign the iCloud and push entitlements).
configs:
  Debug: debug
  Local: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Apple Developer Team ID (Tom's personal team). Change it here if the team changes.
    DEVELOPMENT_TEAM: "X2UM64LDU4"
targets:
  Puggle:
    type: application
    platform: iOS
    sources:
      # Design/Paper.metal needs Apple's Metal Toolchain: xcodebuild -downloadComponent MetalToolchain
      - path: Puggle
      - path: Shared
    dependencies:
      - target: PuggleWidgets
      # The Watch app, carried inside the iPhone app and installed on the Watch with it.
      - target: PuggleWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomgarton.puggle
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Puggle/Resources/Puggle.entitlements
        INFOPLIST_FILE: Puggle/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Local:
          CODE_SIGN_ENTITLEMENTS: ""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG LOCAL_ONLY
  # Lock Screen and Dynamic Island timers. Needs no entitlements, so a free Apple ID can sign it.
  PuggleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PuggleWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomgarton.puggle.widgets
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: PuggleWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Reads the app's summary from the shared App Group (paid account only).
        CODE_SIGN_ENTITLEMENTS: PuggleWidgets/PuggleWidgets.entitlements
      configs:
        Local:
          CODE_SIGN_ENTITLEMENTS: ""
  # The Watch app (20 November 2026): each child's state and one-tap logging. It keeps no database of its own;
  # it talks to the iPhone app over WatchConnectivity (Shared/WatchLink.swift), which saves through the store.
  PuggleWatch:
    type: application
    platform: watchOS
    sources:
      - path: PuggleWatch
      - path: Shared/WidgetSnapshot.swift
      - path: Shared/Terms.swift
      - path: Shared/WatchLink.swift
      - path: Puggle/Resources/AppIcon.icon
    dependencies:
      - target: PuggleWatchWidgets
    settings:
      configs:
        Local:
          CODE_SIGN_ENTITLEMENTS: ""
      base:
        # Shares the summary with its watch-face shortcuts (paid account only).
        CODE_SIGN_ENTITLEMENTS: PuggleWatch/PuggleWatch.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.tomgarton.puggle.watchkitapp
        PRODUCT_NAME: Puggle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Puggle
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.tomgarton.puggle
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        # Tapping the timer card in the Smart Stack opens this app rather than "Open on iPhone" (watchOS 11.1).
        INFOPLIST_KEY_WKSupportsLiveActivityLaunchAttributeTypes: TimerAttributes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
  # Puggle on the watch face: a timer running, or how long since a feed.
  PuggleWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: PuggleWatchWidgets
      - path: Shared/WidgetSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomgarton.puggle.watchkitapp.widgets
        INFOPLIST_FILE: PuggleWatchWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PuggleWatchWidgets/PuggleWatchWidgets.entitlements
        SKIP_INSTALL: YES
      configs:
        Local:
          CODE_SIGN_ENTITLEMENTS: ""
  # The store's logic, tested against an in-memory database.
  PuggleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PuggleTests
    dependencies:
      - target: Puggle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomgarton.puggle.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  # Apple's accessibility audit on the main screens. Not in the test scheme:
  # the app's animations mean it never goes idle, so the audit waits. Run it by hand.
  PuggleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PuggleUITests
    dependencies:
      - target: Puggle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomgarton.puggle.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Puggle
schemes:
  Puggle:
    build:
      targets:
        Puggle: all
    run:
      config: Debug
    archive:
      config: Release
  Puggle Local:
    build:
      targets:
        Puggle: all
    run:
      config: Local
    test:
      config: Local
      targets:
        - PuggleTests
